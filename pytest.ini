[pytest]
# The default suite is HERMETIC: no network, no GPU, no model. It runs in a
# few seconds and gives the same answer on any machine.
#
# `live` marks the one deliberate exception - tests/test_critic_calibration.py,
# which measures how a real model behaves against a real prompt and therefore
# cannot be faked. Those are DESELECTED by default rather than merely skipped,
# so that having Ollama running never silently turns a 4-second suite into a
# 40-second one. Two of this project's UI tests already drifted that way once,
# picking up real inference the moment a local model became the configured
# default, and became slow and flaky before anyone noticed.
#
#   pytest tests/            -> 82 hermetic tests, ~4s
#   pytest -m live tests/    -> 4 calibration tests against the local model
#   pytest -m "" tests/      -> everything
markers =
    live: requires a running local model; deselected unless -m live is given
addopts = -m "not live"
